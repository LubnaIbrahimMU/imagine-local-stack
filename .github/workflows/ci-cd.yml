name: Imagine CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: vharbor.aliien.uk
  HARBOR_PROJECT: pro4
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-and-validate:
    name: Lint & Validate Code
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Helm Charts
        run: |
          helm lint helm/charts/umbrella-app || true
          helm lint helm/charts/frontend-service || true
          helm lint helm/charts/backend-service || true
          helm lint helm/charts/db-service || true
          helm lint helm/charts/redis-service || true
          helm lint helm/charts/backup-service || true

  build-and-push-harbor:
    name: Harbor Container Registry Sync
    needs: lint-and-validate
    # This runner is on the local lab network and can reach Minikube Harbor.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}


      # Use the host Docker daemon. A docker-container Buildx builder does not
      # inherit this lab machine's /etc/hosts mapping for vharbor.aliien.uk and
      # incorrectly resolves the registry to its public IP.
      - name: Build and Push Images with Host Docker
        shell: bash
        run: |
          set -euo pipefail

          for component in frontend backend backup; do
            image="${{ env.REGISTRY }}/${{ env.HARBOR_PROJECT }}/mypro-${component}"

            docker build \
              --tag "${image}:${{ env.IMAGE_TAG }}" \
              --tag "${image}:latest" \
              "./docker/${component}"

            docker push "${image}:${{ env.IMAGE_TAG }}"
            docker push "${image}:latest"
          done

  update-gitops-and-sync-argo:
    name: Update Helm Image Tags for Argo CD GitOps
    needs: build-and-push-harbor
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Helm Image Tags & Chart appVersion to Commit SHA
        run: |
          echo "Updating Helm image tags and Chart appVersion to commit SHA: ${{ env.IMAGE_TAG }}"
          # ./scripts/build-and-push-images.sh "${{ env.REGISTRY }}" "${{ env.HARBOR_PROJECT }}" "${{ env.IMAGE_TAG }}"
          sed -i "/^image:/,/^[^[:space:]]/ s|^  repository: .*|  repository: ${{ env.REGISTRY }}/${{ env.HARBOR_PROJECT }}/mypro-frontend|" helm/charts/frontend-service/values.yaml
          sed -i "/^image:/,/^[^[:space:]]/ s|^  tag: .*|  tag: \"${{ env.IMAGE_TAG }}\"|" helm/charts/frontend-service/values.yaml
          sed -i "s|appVersion: .*|appVersion: \"${{ env.IMAGE_TAG }}\"|g" helm/charts/frontend-service/Chart.yaml
          
          sed -i "/^image:/,/^[^[:space:]]/ s|^  repository: .*|  repository: ${{ env.REGISTRY }}/${{ env.HARBOR_PROJECT }}/mypro-backend|" helm/charts/backend-service/values.yaml
          sed -i "/^image:/,/^[^[:space:]]/ s|^  tag: .*|  tag: \"${{ env.IMAGE_TAG }}\"|" helm/charts/backend-service/values.yaml
          sed -i "s|appVersion: .*|appVersion: \"${{ env.IMAGE_TAG }}\"|g" helm/charts/backend-service/Chart.yaml

          sed -i "/^image:/,/^[^[:space:]]/ s|^  repository: .*|  repository: ${{ env.REGISTRY }}/${{ env.HARBOR_PROJECT }}/mypro-backup|" helm/charts/backup-service/values.yaml
          sed -i "/^image:/,/^[^[:space:]]/ s|^  tag: .*|  tag: \"${{ env.IMAGE_TAG }}\"|" helm/charts/backup-service/values.yaml
          sed -i "s|appVersion: .*|appVersion: \"${{ env.IMAGE_TAG }}\"|g" helm/charts/backup-service/Chart.yaml

          # External images are pinned and must never receive a Git SHA.
          grep -q '^  image: mysql:8.0$' helm/charts/db-service/values.yaml
          grep -q '^  repository: redis$' helm/charts/redis-service/values.yaml
          grep -q '^  tag: 7.2-alpine$' helm/charts/redis-service/values.yaml

          helm dependency update --skip-refresh helm/charts/umbrella-app

      - name: Commit & Push GitOps Tag Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add helm/charts/
          git commit -m "chore(gitops): update application image tags to ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD


      - name: Trigger Argo CD Auto Sync
        run: |
          echo "=== GitOps Commit Pushed. Argo CD Auto-Sync Enabled! ==="
          echo "Argo CD will automatically detect commit '${{ env.IMAGE_TAG }}' and sync the deployment in dev, uat, and prd!"
