name: CloudGate Imagine CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Image version tag'
        required: true
        default: 'v2.0.1'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.inputs.version_tag || github.sha }}

jobs:
  lint-and-validate:
    name: Lint & Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Helm Charts
        run: |
          helm lint helm/charts/umbrella-app || true
          helm lint helm/charts/frontend-service || true
          helm lint helm/charts/backend-service || true

  build-and-push:
    name: Build & Push to Container Registry
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mypro-frontend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/mypro-frontend:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mypro-backend:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/mypro-backend:latest

      - name: Build and Push Backup Image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/backup
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mypro-backup:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository_owner }}/mypro-backup:latest

  update-gitops-and-sync-argo:
    name: Update Helm Values & Trigger Argo CD Sync
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Helm Image Tags
        run: |
          sed -i "s|repository: .*|repository: ghcr.io/${{ github.repository_owner }}/mypro-frontend|g" helm/charts/frontend-service/values.yml
          sed -i "s|tag: .*|tag: ${{ env.IMAGE_TAG }}|g" helm/charts/frontend-service/values.yml
          sed -i "s|repository: .*|repository: ghcr.io/${{ github.repository_owner }}/mypro-backend|g" helm/charts/backend-service/values.yml
          sed -i "s|tag: .*|tag: ${{ env.IMAGE_TAG }}|g" helm/charts/backend-service/values.yml

      - name: Commit & Push GitOps Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/charts/
          git commit -m "chore(gitops): update application image tag to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push origin HEAD

      - name: Trigger Argo CD Auto Sync
        run: |
          echo "=== GitOps Commit Pushed. Argo CD Auto-Sync Enabled! ==="
          echo "Argo CD will automatically detect the new image tag commit '${{ env.IMAGE_TAG }}' and sync the deployment."
