<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enterprise Microservice Portal | MyPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        main {
            width: min(1000px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--panel-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .status {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--warning);
            display: inline-block;
        }

        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--danger); }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            align-items: start;
        }

        section {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin: 0 0 18px;
            font-size: 18px;
            font-weight: 600;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        input {
            width: 100%;
            height: 42px;
            border: 1px solid var(--panel-border);
            background: #0f172a;
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0 14px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            height: 42px;
            border: 0;
            border-radius: 8px;
            padding: 0 18px;
            background: var(--accent);
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: var(--accent-hover); color: #fff; }

        .secondary {
            background: #334155;
            color: var(--text-primary);
        }
        .secondary:hover { background: #475569; }

        .danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            height: 32px;
            padding: 0 10px;
            font-size: 12px;
        }
        .danger:hover { background: var(--danger); color: #fff; }

        form button { width: 100%; margin-top: 20px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border-bottom: 1px solid var(--panel-border);
            padding: 14px 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td:last-child, th:last-child {
            width: 90px;
            text-align: right;
        }

        .meta-info {
            margin-top: 24px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div class="brand">
                <h1>MyPro Enterprise Portal</h1>
                <span class="badge">NGINX + Vault + ArgoCD</span>
            </div>
            <button id="refresh" class="secondary" type="button">Refresh Users</button>
        </header>

        <div class="layout">
            <section>
                <h2>Create New User</h2>
                <form id="user-form">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" placeholder="e.g. Alice Smith" required>

                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" placeholder="e.g. alice@mypro.local" required>

                    <button type="submit">Submit User</button>
                </form>
            </section>

            <section>
                <div class="toolbar">
                    <div class="status">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="status">Connecting to Backend API...</span>
                    </div>
                    <span id="count" style="font-size: 13px; color: var(--text-secondary);"></span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users"></tbody>
                </table>
            </section>
        </div>

        <div class="meta-info">
            <span id="backend-server">Backend Instance: Loading...</span>
            <span id="cache-status">Cache: -</span>
            <span id="db-node">DB Active Node: -</span>
        </div>
    </main>

    <script>
        const usersTable = document.querySelector("#users");
        const statusEl = document.querySelector("#status");
        const statusDot = document.querySelector("#status-dot");
        const countEl = document.querySelector("#count");
        const form = document.querySelector("#user-form");

        function setStatus(msg, state = "warning") {
            statusEl.textContent = msg;
            statusDot.className = `status-dot ${state === 'online' ? 'online' : state === 'offline' ? 'offline' : ''}`;
        }

        async function loadUsers() {
            setStatus("Fetching latest data...", "warning");
            try {
                const response = await fetch("/api/users");
                if (!response.ok) throw new Error(`API error ${response.status}`);

                const payload = await response.json();
                const users = payload.data || [];
                usersTable.innerHTML = "";
                countEl.textContent = `${payload.count ?? users.length} Registered Users`;

                for (const user of users) {
                    const row = document.createElement("tr");

                    const idCell = document.createElement("td");
                    idCell.textContent = `#${user.id}`;

                    const nameCell = document.createElement("td");
                    nameCell.textContent = user.name;

                    const emailCell = document.createElement("td");
                    emailCell.textContent = user.email;

                    const actionCell = document.createElement("td");
                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "danger";
                    deleteBtn.dataset.id = user.id;
                    deleteBtn.textContent = "Delete";
                    actionCell.appendChild(deleteBtn);

                    row.append(idCell, nameCell, emailCell, actionCell);
                    usersTable.appendChild(row);
                }

                document.getElementById("backend-server").textContent = `Backend Pod: ${payload.server || 'Unknown'}`;
                document.getElementById("cache-status").textContent = `Cache: ${payload.cached ? 'HIT (Redis)' : 'MISS (Database)'}`;
                document.getElementById("db-node").textContent = `Active DB: ${payload.active_db_node || 'Primary'}`;
                setStatus("System Operational", "online");
            } catch (err) {
                setStatus(`Backend API Error: ${err.message}`, "offline");
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const payload = { name: formData.get("name"), email: formData.get("email") };

            const res = await fetch("/api/users", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const err = await res.json();
                setStatus(err.error || "Failed to create user", "offline");
                return;
            }

            form.reset();
            await loadUsers();
        });

        usersTable.addEventListener("click", async (e) => {
            const btn = e.target.closest("button[data-id]");
            if (!btn) return;

            const res = await fetch(`/api/users/${btn.dataset.id}`, { method: "DELETE" });
            if (res.ok) await loadUsers();
            else setStatus(`Delete failed: ${res.status}`, "offline");
        });

        document.querySelector("#refresh").addEventListener("click", loadUsers);
        loadUsers();
    </script>
</body>
</html>
