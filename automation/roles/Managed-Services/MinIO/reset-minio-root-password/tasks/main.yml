---
- name: Set facts for MinIO root password reset
  ansible.builtin.set_fact:
    m_new_root_user: "{{ new_root_user | default('admin', true) }}"
    m_new_root_pass: "{{ new_root_password | default('', true) }}"
    m_deploy_dir: "/home/ubuntu/managed-minio"
    m_container: "{{ minio_container | default('cloudgate_managed_minio', true) }}"

- name: Validate root password reset inputs
  ansible.builtin.assert:
    that:
      - m_new_root_pass | length > 0
    fail_msg: "new_root_password is required for reset_root_password operation"
    quiet: true

- name: Reset Root Password via Docker container or Kubernetes pod
  ansible.builtin.shell: |
    if [ -f "{{ m_deploy_dir }}/docker-compose.yml" ]; then
      sed -i "s/MINIO_ROOT_USER:.*/MINIO_ROOT_USER: {{ m_new_root_user }}/g" "{{ m_deploy_dir }}/docker-compose.yml"
      sed -i "s/MINIO_ROOT_PASSWORD:.*/MINIO_ROOT_PASSWORD: {{ m_new_root_pass }}/g" "{{ m_deploy_dir }}/docker-compose.yml"
      docker compose -f "{{ m_deploy_dir }}/docker-compose.yml" up -d --force-recreate
      sleep 3
      docker exec {{ m_container }} mc alias set local http://127.0.0.1:9000 {{ m_new_root_user }} {{ m_new_root_pass }} 2>/dev/null || true
    elif command -v kubectl &>/dev/null; then
      POD_NAME=$(kubectl get pod -n minio -l app=minio -o jsonpath='{% raw %}{.items[0].metadata.name}{% endraw %}' 2>/dev/null || kubectl get pod -n minio -l app.kubernetes.io/name=minio -o jsonpath='{% raw %}{.items[0].metadata.name}{% endraw %}')
      if [ -n "$POD_NAME" ]; then
        kubectl create secret generic minio-secret -n minio --from-literal=rootUser={{ m_new_root_user }} --from-literal=rootPassword={{ m_new_root_pass }} --dry-run=client -o yaml | kubectl apply -f -
        kubectl rollout restart deployment/minio -n minio
        kubectl exec -n minio "$POD_NAME" -- mc alias set local http://127.0.0.1:9000 {{ m_new_root_user }} {{ m_new_root_pass }} 2>/dev/null || true
      fi
    fi
  changed_when: false

- name: Set fact for reset_root_password result
  ansible.builtin.set_fact:
    cg_result:
      status: success
      action: reset_root_password
      root_user: "{{ m_new_root_user }}"
      message: "MinIO root credentials updated successfully"
