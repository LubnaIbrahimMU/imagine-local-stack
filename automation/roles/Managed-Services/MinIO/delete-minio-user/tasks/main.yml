---
- name: Set facts for MinIO user deletion
  ansible.builtin.set_fact:
    m_user: "{{ minio_user | default(user_name | default(user_username | default(cg_spec.user_name | default('app-user', true), true), true), true) }}"
    m_root_user: "{{ root_user | default(cg_spec.root_user | default(minio_root_user_input | default('admin', true), true), true) }}"
    m_root_pass: "{{ root_password | default(cg_spec.root_password | default(cg_spec.service_config.root_password | default(minio_root_password_input | default('MinioAdminPassword123', true), true), true), true) }}"
    m_endpoint: "{{ endpoint | default('http://127.0.0.1:9000', true) }}"
    m_container: "{{ minio_container | default('cloudgate_managed_minio', true) }}"

- name: Validate delete user inputs
  ansible.builtin.assert:
    that:
      - m_user | length > 0
    fail_msg: "minio_user is required for delete_user operation"
    quiet: true

- name: Delete MinIO User via Docker container or Kubernetes pod
  ansible.builtin.shell: |
    if docker ps --format '{% raw %}{{.Names}}{% endraw %}' | grep -q "^{{ m_container }}$"; then
      docker exec {{ m_container }} mc alias set local {{ m_endpoint }} {{ m_root_user }} {{ m_root_pass }}
      docker exec {{ m_container }} mc admin user remove local {{ m_user }}
    elif command -v kubectl &>/dev/null; then
      POD_NAME=$(kubectl get pod -n minio -l app=minio -o jsonpath='{% raw %}{.items[0].metadata.name}{% endraw %}' 2>/dev/null || kubectl get pod -n minio -l app.kubernetes.io/name=minio -o jsonpath='{% raw %}{.items[0].metadata.name}{% endraw %}')
      if [ -n "$POD_NAME" ]; then
        kubectl exec -n minio "$POD_NAME" -- mc alias set local http://127.0.0.1:9000 {{ m_root_user }} {{ m_root_pass }} 2>/dev/null || true
        kubectl exec -n minio "$POD_NAME" -- mc admin user remove local {{ m_user }}
      else
        echo "MinIO pod not found in minio namespace" && exit 1
      fi
    else
      echo "MinIO container or Kubernetes pod not found" && exit 1
    fi
  register: delete_user_res
  changed_when: false

- name: Set fact for delete_user result
  ansible.builtin.set_fact:
    cg_result:
      status: success
      action: delete_user
      access_key: "{{ m_user }}"
      message: "MinIO user '{{ m_user }}' removed successfully (or already removed)"
