apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: https://vgrafana.aliien.uk
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 58.x
      helm:
        valueFiles:
          - $values/infrastructure/monitoring/values-prometheus.yml
    - repoURL: https://github.com/LubnaIbrahimMU/imagine-local-stack.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
