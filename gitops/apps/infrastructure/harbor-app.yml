apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      # Keep this exactly aligned with infrastructure/harbor/harbor-setup.sh.
      # A floating bootstrap chart can write a newer Valkey RDB that the
      # Argo-managed Redis version cannot read after reconciliation.
      targetRevision: 1.15.2
      helm:
        valueFiles:
          - $values/infrastructure/harbor/harbor-values.yml
    - repoURL: https://github.com/LubnaIbrahimMU/imagine-local-stack.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
