apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-backup-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev-project
  source:
    repoURL: https://github.com/LubnaIbrahimMU/imagine-local-stack.git
    targetRevision: HEAD
    path: helm/charts/backup-service
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
