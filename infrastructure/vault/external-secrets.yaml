# ==============================================================================
# External Secrets Operator (ESO) - ClusterSecretStore & ExternalSecrets
# Integrates HashiCorp Vault with Kubernetes secrets in harbor & minio namespaces
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "YOUR_VAULT_ROLE_ID"
          secretRef:
            name: vault-approle-secret
            key: secret-id

---
# MinIO ExternalSecret (Namespace: minio)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-secret
    creationPolicy: Owner
  data:
    - secretKey: root-user
      remoteRef:
        key: secret/data/minio
        property: root_user
    - secretKey: root-password
      remoteRef:
        key: secret/data/minio
        property: root_password

---
# Harbor ExternalSecret (Namespace: harbor)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-credentials
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: secret/data/harbor
        property: admin_password
    - secretKey: db-password
      remoteRef:
        key: secret/data/harbor
        property: database_password
