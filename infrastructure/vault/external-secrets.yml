# ==============================================================================
# External Secrets Operator (ESO) - ClusterSecretStore & ExternalSecrets
# Integrates HashiCorp Vault with Kubernetes secrets across namespaces
# ==============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "app-role"
          serviceAccountRef:
            name: default
            namespace: vault

---
# MinIO ExternalSecret (Namespace: minio)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-secret
    creationPolicy: Owner
  data:
    - secretKey: root-user
      remoteRef:
        key: secret/data/dev/minio
        property: root-user
    - secretKey: root-password
      remoteRef:
        key: secret/data/dev/minio
        property: root-password

---
# Harbor ExternalSecret (Namespace: harbor)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-credentials
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: secret/data/dev/harbor
        property: admin-password

---
# Cloudflare ExternalSecret (Namespace: cert-manager)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: secret/data/dev/cloudflare
        property: api-token

---
# Argo CD Repository ExternalSecret (Namespace: argocd)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: repo-imagine-local-stack
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: repo-imagine-local-stack
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: https://github.com/LubnaIbrahimMU/imagine-local-stack.git
        username: LubnaIbrahimMU
        password: "{{ .github_token }}"
  data:
    - secretKey: github_token
      remoteRef:
        key: secret/data/dev/github
        property: token
