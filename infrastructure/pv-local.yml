---
# ------------------------------------------------------------------------------
# 7. Dedicated Local Host Backup Volume (500Mi) -> /mnt/data/backups
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-backup-local
  labels:
    app: backup
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/mnt/data/backups"
    type: DirectoryOrCreate
  claimRef:
    namespace: default
    name: backup-local-pvc
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-local-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-minio-data
  namespace: minio
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
