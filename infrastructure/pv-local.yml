# ==============================================================================
# Ultra-Lightweight HostPath PersistentVolumes (PV)
# Total disk footprint across all services: ~3.75 GB (Optimized for <10GB disk)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Custom Local StorageClass
# ------------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
# ------------------------------------------------------------------------------
# 2. Vault PersistentVolume (500Mi)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-vault-data
  labels:
    app: vault
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/mnt/data/vault"
    type: DirectoryOrCreate
  claimRef:
    namespace: vault
    name: data-vault-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube

---
# ------------------------------------------------------------------------------
# 3. MinIO PersistentVolume (1Gi)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio-data
  labels:
    app: minio
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: "/mnt/data/minio"
    type: DirectoryOrCreate
  claimRef:
    namespace: minio
    name: pvc-minio-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - minikube

---
# ------------------------------------------------------------------------------
