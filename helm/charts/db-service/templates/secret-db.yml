{{- if not .Values.mysql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    app.kubernetes.io/name: db-service
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  db-root-password: {{ required "mysql.rootPassword is required if existingSecret is not provided!" .Values.mysql.rootPassword | quote }}
  db-password: {{ required "mysql.password is required if existingSecret is not provided!" .Values.mysql.password | quote }}
  db-user: {{ .Values.mysql.user | quote }}
  db-name: {{ .Values.mysql.database | quote }}
{{- end }}
