apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db-primary
  labels:
    app.kubernetes.io/name: db-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      name: mysql
  selector:
    app.kubernetes.io/name: db-service
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: primary
