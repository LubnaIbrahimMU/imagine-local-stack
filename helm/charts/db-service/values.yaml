mysql:
  image: mysql:8.0
  existingSecret: mypro-dev-db-secret

imagePullSecrets:
  - name: harbor-pull-secret

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
