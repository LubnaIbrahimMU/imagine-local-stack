mysql:
  image: vharbor.aliien.uk/pro4/mypro-backup:"ebe5ceee912d6f4a0bb9d1acabd35956353add43"
  existingSecret: mypro-dev-db-secret

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

backupCronJob:
  enabled: true
  schedule: "0 */6 * * *"
  image: vharbor.aliien.uk/pro4/mypro-backup:"ebe5ceee912d6f4a0bb9d1acabd35956353add43"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
