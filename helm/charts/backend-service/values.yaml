replicaCount: 2

image:
  repository: vharbor.aliien.uk/pro4/mypro-backend
  tag: "50dfa8a2e71bc6daa9cbfa26c71b04a5a9e4b4d3"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: vapi.aliien.uk
  tls: true
  tlsSecretName: aliien-uk-tls

vault:
  enabled: true
  role: app-role
  secretPath: secret/data/dev/database

env:
  dbHost: db-primary
  dbPort: "3306"
  dbName: appdb
  dbUser: appuser
  dbSecretName: mypro-dev-db-secret
  dbStandbyHost: db-standby
  redisHost: redis-service
  redisPort: "6379"
  cacheTtl: "30"
  logLevel: INFO
  minioEndpoint: "http://minio.minio.svc.cluster.local:9000"
  minioBucket: "app-backups"

resources:
  limits:
    cpu: 350m
    memory: 384Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
