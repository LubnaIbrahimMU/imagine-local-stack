replicaCount: 2

image:
  repository: vharbor.aliien.uk/pro4/mypro-frontend
  tag: "293f827afce22448b2aaf57436ac5a0d7a61a9c4"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: app.dev.mypro.local
  tls: false

env:
  backendUrl: "http://app-mypro-dev-backend-service:5000"
  port: "3000"
  timeoutMs: "5000"

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
